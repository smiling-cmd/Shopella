<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>

    {% load static %}
    <link rel="stylesheet" href="{% static 'css/register.css' %}">
</head>

<body>
    <a href="/services">  services</a>

    <a href="/index">  homepage</a>

    <a href="/about">  about</a>

    <a href="/contact">  contact</a>

    <h1>Contact Form</h1>
    <p class="intro">Please enter your details:</p>

    <form method="post">
        {% csrf_token %}
        <p>Required fields are marked with an asterisk.</p>

        <div class="form-group">
            <label for="fname">*First name:</label>
            <input type="text" id="fname" name="fname" required>
        </div>

        <div class="form-group">
            <label for="lname">*Last name:</label>
            <input type="text" id="lname" name="lname" required>
        </div>

        <div class="form-group">
            <label for="email">*Email:</label>
            <input type="email" id="email" name="email" required>
        </div>

        <div class="form-group">
            <label for="tel">Tel:</label>
            <input type="tel" id="tel" name="tel">
        </div>

        <div class="form-group">
            <label for="fax">Fax:</label>
            <input type="tel" id="fax" name="fax">
        </div>

        <div class="form-group">
            <label for="mob">Mob:</label>
            <input type="tel" id="mob" name="mob">
        </div>

        <div class="form-group">
            <label for="dob">*Date of Birth:</label>
            <input type="date" id="dob" name="dob" required>
        </div>

        <fieldset>
            <legend>Gender*</legend>

            <input type="radio" id="male" name="gender" value="Male" required>
            <label for="male">Male</label>
            <br>

            <input type="radio" id="female" name="gender" value="Female" required>
            <label for="female">Female</label>
            <br>

            <input type="radio" id="nonbinary" name="gender" value="Non-binary" required>
            <label for="nonbinary">Non-binary</label>
        </fieldset>

        <div class="comment-group">
            <label for="message">Leave a comment:</label>
            <textarea name="message" id="message" rows="4"></textarea>
        </div>

        <button type="submit">Submit</button>

    </form>

    </body>
</html>
